name: branch-name

on:
  pull_request:
    types: [opened, reopened, edited, synchronize]

jobs:
  branch-name-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Bypass for Dependabot
        if: ${{ github.actor == 'dependabot[bot]' || startsWith(github.head_ref, 'dependabot/') }}
        run: echo "Skipping branch-name lint for Dependabot-authored PR."

      - name: Validate head branch name
        if: ${{ github.actor != 'dependabot[bot]' && !startsWith(github.head_ref, 'dependabot/') }}
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if ! echo "$HEAD_REF" | grep -qE '^(feature|fix|hotfix|chore|refactor|docs|test|ci)/[a-z0-9][a-z0-9-]*$'; then
            echo "::error::Branch name '$HEAD_REF' does not match the convention."
            echo "Allowed prefixes: feature/, fix/, hotfix/, chore/, refactor/, docs/, test/, ci/"
            echo "Slug rules: lowercase a-z, digits 0-9, hyphens; no leading hyphen; no underscores."
            exit 1
          fi
