name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - 'release/v*'

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make typecheck

  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - run: make test-coverage
      - name: Build coverage summary
        if: always()
        run: |
          if [ ! -f coverage/coverage-summary.json ]; then exit 0; fi
          {
            echo "<!-- coverage-report -->"
            echo "## Test coverage (vitest, src/**)"
            echo ""
            echo "| Metric | Covered | Total | % |"
            echo "|---|---:|---:|---:|"
            jq -r '.total | to_entries[] | select(.key == "lines" or .key == "statements" or .key == "functions" or .key == "branches") |
              "| \(.key) | \(.value.covered) | \(.value.total) | \(.value.pct)% |"' coverage/coverage-summary.json
            echo ""
            echo "_Unit + integration (vitest) over \`src/**\`. The player/map browser bundles and the DM UI flows are additionally covered by the Playwright visual suite and the real-Obsidian e2e suite, which do not feed this metric._"
          } > coverage/summary.md
          cat coverage/summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Comment coverage on PR
        if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -f coverage/summary.md ]; then exit 0; fi
          PR=${{ github.event.pull_request.number }}
          REPO=${{ github.repository }}
          CID=$(gh api "repos/$REPO/issues/$PR/comments" --jq '.[] | select(.body | startswith("<!-- coverage-report -->")) | .id' | head -1)
          if [ -n "$CID" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$CID" -F body=@coverage/summary.md
          else
            gh api "repos/$REPO/issues/$PR/comments" -F body=@coverage/summary.md
          fi

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make build

  visual:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make test-visual
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diffs
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - versions: earliest/earliest
            slug: earliest
          - versions: latest/latest
            slug: latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: .obsidian-cache
          key: obsidian-cache-${{ matrix.slug }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            obsidian-cache-${{ matrix.slug }}-
      - run: make test-e2e
        env:
          OBSIDIAN_VERSIONS: ${{ matrix.versions }}
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs-${{ matrix.slug }}
          path: wdio-logs/
          retention-days: 7
          if-no-files-found: ignore
