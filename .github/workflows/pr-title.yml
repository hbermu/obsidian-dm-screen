name: pr-title

on:
  pull_request:
    types: [opened, reopened, edited, synchronize]

jobs:
  pr-title-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Bypass for Dependabot
        if: ${{ github.actor == 'dependabot[bot]' }}
        run: echo "Skipping PR-title lint for Dependabot-authored PR (its commit-message prefix is enforced in .github/dependabot.yml)."

      - name: Validate PR title
        if: ${{ github.actor != 'dependabot[bot]' }}
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          if ! echo "$TITLE" | grep -qE '^release(\([a-z0-9-]+\))?: .+$|^(feat|feature|fix|hotfix|chore|refactor|docs|test|ci)(\([a-z0-9-]+\))?: .{10,}$'; then
            echo "::error::PR title '$TITLE' does not match Conventional Commits."
            echo "Format: <type>(<scope>): <subject>"
            echo "Types: feat, fix, hotfix, chore, refactor, docs, test, ci, release"
            echo "Scope (optional): a feature dir under .agent/features/ or deps/release/repo"
            echo "Subject: at least 10 chars (imperative mood, no trailing period); release titles may be shorter, e.g. 'release: v0.9.0'."
            exit 1
          fi
