name: release

on:
  pull_request:
    types: [closed]
    branches: [main]
  push:
    branches-ignore:
      - main

jobs:
  publish:
    if: >
      (github.event_name == 'pull_request' && github.event.pull_request.merged == true) ||
      github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && 'main' || github.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine bump from PR labels (merge path)
        if: github.event_name == 'pull_request'
        id: pr_bump
        env:
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          labels=$(echo "$LABELS" | jq -r '.[]')
          if echo "$labels" | grep -qx "release:skip"; then
            echo "type=skip" >> $GITHUB_OUTPUT
          elif echo "$labels" | grep -qx "release:major"; then
            echo "type=major" >> $GITHUB_OUTPUT
          elif echo "$labels" | grep -qx "release:minor"; then
            echo "type=minor" >> $GITHUB_OUTPUT
          else
            echo "type=patch" >> $GITHUB_OUTPUT
          fi

      - name: Skip release when label says so
        if: github.event_name == 'pull_request' && steps.pr_bump.outputs.type == 'skip'
        run: |
          echo "Release skipped (release:skip label on PR #${{ github.event.pull_request.number }})."
          exit 0

      # ────────────── Merge-to-main path: auto-bump and publish stable ──────────────

      - name: Compute next stable version (from latest stable tag)
        if: github.event_name == 'pull_request' && steps.pr_bump.outputs.type != 'skip'
        id: next
        env:
          BUMP: ${{ steps.pr_bump.outputs.type }}
        run: |
          latest=$(git tag --list 'v*' --sort=-version:refname \
              | grep -vE -- '-beta\.[0-9]+$' | head -1)
          if [ -z "$latest" ]; then
            current="0.0.0"
          else
            current="${latest#v}"
          fi
          IFS=. read -r MA MI PA <<< "$current"
          case "$BUMP" in
            major) MA=$((MA+1)); MI=0; PA=0 ;;
            minor) MI=$((MI+1)); PA=0 ;;
            patch) PA=$((PA+1)) ;;
          esac
          echo "version=$MA.$MI.$PA" >> $GITHUB_OUTPUT
          echo "Bumping from $current ($BUMP) to $MA.$MI.$PA"

      - name: Bump version in three files (working tree, not committed yet)
        if: github.event_name == 'pull_request' && steps.pr_bump.outputs.type != 'skip'
        env:
          VERSION: ${{ steps.next.outputs.version }}
        run: |
          for f in package.json package-lock.json manifest.json; do
            tmp=$(mktemp)
            jq --arg v "$VERSION" '.version = $v' "$f" > "$tmp" && mv "$tmp" "$f"
          done
          tmp=$(mktemp)
          jq --arg v "$VERSION" '.packages[""].version = $v' package-lock.json > "$tmp" && mv "$tmp" package-lock.json

      - name: Build artefacts (merge path)
        if: github.event_name == 'pull_request' && steps.pr_bump.outputs.type != 'skip'
        run: make build

      - name: Build categorized release notes
        if: github.event_name == 'pull_request' && steps.pr_bump.outputs.type != 'skip'
        id: notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.next.outputs.version }}
        run: |
          prev_tag=$(git describe --tags --abbrev=0 HEAD 2>/dev/null || echo "")
          if [ -n "$prev_tag" ]; then
            since=$(git log -1 --format=%cI "$prev_tag")
          else
            since="1970-01-01T00:00:00Z"
          fi
          prs=$(gh pr list --state merged --base main \
              --search "merged:>$since" \
              --json number,title --limit 200)

          cat_match() {
            echo "$prs" | jq -r --arg re "$1" \
              '.[] | select(.title | test($re; "i")) | "- \(.title) (#\(.number))"'
          }
          features=$(cat_match '^(feat|feature)(\(|:)')
          fixes=$(cat_match '^(fix|hotfix)(\(|:)')
          docs=$(cat_match '^docs(\(|:)')
          ci=$(cat_match '^(ci|chore|build)(\(|:)')
          other=$(cat_match '^(refactor|test|perf|style|revert|release)(\(|:)')

          {
            [ -n "$features" ] && printf "### Features\n%s\n\n" "$features"
            [ -n "$fixes" ]    && printf "### Fixes\n%s\n\n" "$fixes"
            [ -n "$docs" ]     && printf "### Documentation\n%s\n\n" "$docs"
            [ -n "$ci" ]       && printf "### Build & CI\n%s\n\n" "$ci"
            [ -n "$other" ]    && printf "### Other\n%s\n\n" "$other"
            if [ -n "$prev_tag" ]; then
              echo "**Full Changelog**: https://github.com/${GITHUB_REPOSITORY}/compare/${prev_tag}...v${VERSION}"
            fi
          } > notes.md
          echo "Generated notes:"
          cat notes.md

      - name: Tag the bumped commit (without touching main)
        if: github.event_name == 'pull_request' && steps.pr_bump.outputs.type != 'skip'
        env:
          VERSION: ${{ steps.next.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Commit the bump on a detached head so we can tag a commit that
          # contains the new version files. The branch is never pushed; only
          # the tag is, so main stays untouched and protection is respected.
          git checkout --detach
          git add package.json package-lock.json manifest.json
          git commit -m "release: v$VERSION"
          git tag -a "v$VERSION" -m "v$VERSION"
          git push origin "v$VERSION"

      - name: Publish stable release
        if: github.event_name == 'pull_request' && steps.pr_bump.outputs.type != 'skip'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.next.outputs.version }}
        run: |
          gh release create "v$VERSION" \
              --title "v$VERSION" \
              --notes-file notes.md \
              main.js manifest.json styles.css

      - name: Clean up all beta releases and tags
        if: github.event_name == 'pull_request' && steps.pr_bump.outputs.type != 'skip'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.next.outputs.version }}
        run: |
          gh release list --limit 200 --json tagName --jq '.[] | .tagName' \
            | while read -r tag; do
                case "$tag" in
                  *-beta.*) echo "Deleting prerelease $tag (stable v$VERSION published)"
                            gh release delete "$tag" --yes --cleanup-tag ;;
                esac
              done

      # ────────────── Push-to-any-non-main-branch path: beta only ──────────────

      - name: Read version from manifest.json (push path)
        if: github.event_name == 'push'
        id: ver
        run: |
          VERSION=$(jq -r .version manifest.json)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          if echo "$VERSION" | grep -qE -- '-beta\.[0-9]+$'; then
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "is_prerelease=false" >> $GITHUB_OUTPUT
          fi

      - name: Skip non-beta push (manifest has no -beta.N suffix)
        if: github.event_name == 'push' && steps.ver.outputs.is_prerelease != 'true'
        run: |
          echo "manifest.json version '${{ steps.ver.outputs.version }}' has no -beta.N suffix on branch '${{ github.ref_name }}'; nothing to publish."

      - name: Bail if prerelease tag already exists
        if: github.event_name == 'push' && steps.ver.outputs.is_prerelease == 'true'
        id: tag_check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          # actions/checkout@v4 does not fetch tags by default, so checking
          # `git rev-parse "v$VERSION"` against the workflow's local repo
          # always misses on a fresh checkout. Check the remote tag list and
          # the GitHub releases API instead — either signal means we already
          # published this prerelease and the push is a re-run.
          if gh release view "v$VERSION" >/dev/null 2>&1 \
             || git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "::notice::Tag v$VERSION already exists on remote; nothing to publish."
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Bail if stable of this line was already published
        if: github.event_name == 'push' && steps.ver.outputs.is_prerelease == 'true' && steps.tag_check.outputs.exists == 'false'
        id: stable_check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          # Strip the -beta.N suffix to get the corresponding stable version.
          # If a stable release for that line already exists, the prerelease
          # is orphan-by-construction: it would either re-create a release
          # that the previous stable's cleanup deleted (the exact bug this
          # guard catches) or sit alongside a shipped stable, which makes
          # no sense for BRAT subscribers.
          BASE="${VERSION%-beta.*}"
          if gh release view "v$BASE" >/dev/null 2>&1; then
            echo "stable_exists=true" >> $GITHUB_OUTPUT
            echo "::notice::Stable release v$BASE already exists; refusing to publish v$VERSION. Bump manifest.json on main to the next planned dev version (or to the latest stable) to re-arm beta publishing."
          else
            echo "stable_exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Build prerelease artefacts
        if: github.event_name == 'push' && steps.ver.outputs.is_prerelease == 'true' && steps.tag_check.outputs.exists == 'false' && steps.stable_check.outputs.stable_exists == 'false'
        run: make build

      - name: Create prerelease tag
        if: github.event_name == 'push' && steps.ver.outputs.is_prerelease == 'true' && steps.tag_check.outputs.exists == 'false' && steps.stable_check.outputs.stable_exists == 'false'
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" -m "v$VERSION"
          git push origin "v$VERSION"

      - name: Publish prerelease
        if: github.event_name == 'push' && steps.ver.outputs.is_prerelease == 'true' && steps.tag_check.outputs.exists == 'false' && steps.stable_check.outputs.stable_exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          gh release create "v$VERSION" \
              --title "v$VERSION" \
              --generate-notes \
              --prerelease \
              main.js manifest.json styles.css
